<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>String Art Pro – Secuencia de pines</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 24px; background: #f0f2f5; }
    .wrap { max-width: 980px; margin: 0 auto; }
    .top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    input[type="file"] { padding: 8px; border: 1px solid #ddd; border-radius: 8px; background: white; }
    input[type="number"] { padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px; width: 150px; }
    button { padding: 10px 14px; border: 1px solid #ddd; border-radius: 10px; background: #fff; cursor: pointer; font-weight: 500; transition: all 0.2s; }
    button:active { transform: translateY(1px); background: #eee; }
    
    .card { margin-top: 16px; padding: 18px; border: 1px solid #eee; border-radius: 14px; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .big { font-size: 84px; font-weight: 800; line-height: 1; text-align: center; margin: 18px 0 6px; user-select: none; }
    
    /* Colores dinámicos */
    .par { color: #007bff; }
    .impar { color: #dc3545; }

    #pass-count { font-size: 26px; vertical-align: super; margin-left: 8px; color: #666; font-weight: 600; }
    .sub { text-align: center; font-size: 16px; color: #555; user-select: none; }
    
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 14px; }
    .mini { padding: 12px; border: 1px solid #eee; border-radius: 12px; background: #fafafa; text-align: center; }
    .mini h3 { margin: 0 0 8px; font-size: 14px; color: #666; font-weight: 650; }
    .mini .val { font-size: 26px; font-weight: 750; }
    
    .navBtns { display:flex; gap:10px; justify-content:center; margin: 20px 0; }
    .navBtns button { min-width: 140px; height: 80px; font-size: 18px; border: 2px solid #ddd; flex: 1; }

    .search-box { margin-top: 30px; padding: 20px; background: #fff; border-radius: 14px; border: 1px solid #ddd; }
    .search-box h2 { margin-top: 0; font-size: 20px; }
    .search-results { margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
    .connection-list { list-style: none; padding: 0; font-family: monospace; }
    .connection-list li { padding: 8px 0; border-bottom: 1px solid #f0f0f0; line-height: 1.4; }
    .highlight { font-weight: bold; color: #000; padding: 2px 6px; border-radius: 4px; background: #ffeb3b; }

    .hint { margin-top: 12px; color: #666; font-size: 14px; text-align:center; }
    html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>String Art – Secuencia</h1>

    <div class="top">
      <input id="file" type="file" accept=".txt,text/plain" />
      <div class="group">
        <input id="gotoStep" type="number" min="1" placeholder="Ir al paso..." />
        <button id="gotoBtn" type="button">Ir</button>
      </div>
      <button id="reset" type="button">Reiniciar</button>
      <button id="clear" type="button">Borrar todo</button>
      <span id="status" class="sub"></span>
    </div>

    <div class="card" id="card" style="display:none;">
      <div class="big" id="current">—<span id="pass-count"></span></div>
      <div id="progress" class="sub">Cargá un archivo para empezar</div>

      <div class="navBtns">
        <button id="prevBtn" type="button" style="background: #ffebee; border-color: #ffcdd2;">◀ Anterior<br><small>(Grave)</small></button>
        <button id="nextBtn" type="button" style="background: #e3f2fd; border-color: #bbdefb;">Siguiente ▶<br><small>(Agudo)</small></button>
      </div>

      <div class="row">
        <div class="mini"><h3>Anterior</h3><div class="val" id="prev">—</div></div>
        <div class="mini"><h3>Siguiente</h3><div class="val" id="next">—</div></div>
        <div class="mini"><h3>Total Pasos</h3><div class="val" id="total">—</div></div>
      </div>
    </div>

    <div class="search-box" id="searchSection" style="display:none;">
      <h2>🔍 Historial del Clavo</h2>
      <div class="group">
        <input id="pinSearchInput" type="number" placeholder="Nº de clavo" />
        <button id="searchBtn" type="button">Buscar</button>
      </div>
      <div id="searchResults" class="search-results">
        <p>Busca un clavo para ver sus conexiones.</p>
      </div>
    </div>

    <div class="hint">
      <b>Controles:</b> Espacio/Flecha Derecha = Siguiente | Flecha Izquierda = Anterior<br>
      <b>Colores:</b> <span class="par">Azul (Par)</span> | <span class="impar">Rojo (Impar)</span>
    </div>
  </div>

  <script>
    let seq = [];
    let i = 0;
    let audioCtx = null;

    const els = {
      file: document.getElementById('file'),
      gotoStep: document.getElementById('gotoStep'),
      gotoBtn: document.getElementById('gotoBtn'),
      reset: document.getElementById('reset'),
      clear: document.getElementById('clear'),
      card: document.getElementById('card'),
      current: document.getElementById('current'),
      passCount: document.getElementById('pass-count'),
      progress: document.getElementById('progress'),
      prev: document.getElementById('prev'),
      next: document.getElementById('next'),
      total: document.getElementById('total'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      pinSearchInput: document.getElementById('pinSearchInput'),
      searchBtn: document.getElementById('searchBtn'),
      searchResults: document.getElementById('searchResults'),
      searchSection: document.getElementById('searchSection')
    };

    // --- LÓGICA DE AUDIO ---
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      initAudio();
      // Crear un buffer de silencio corto para mantener el canal abierto en iOS
      const buffer = audioCtx.createBuffer(1, 1, 22050);
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      if (type === 'next') {
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } else {
        osc.frequency.setValueAtTime(220, audioCtx.currentTime); 
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      }

      osc.connect(gain);
      gain.connect(audioCtx.destination);
    }

    // --- LÓGICA DE NEGOCIO ---
    function getPassCount(targetIdx) {
      const pin = seq[targetIdx];
      let count = 0;
      for (let n = 0; n <= targetIdx; n++) {
        if (seq[n] === pin) count++;
      }
      return count;
    }

    function searchPinInfo() {
      const targetPin = Number(els.pinSearchInput.value);
      if (els.pinSearchInput.value === "" || isNaN(targetPin) || !seq.length) {
        els.searchResults.innerHTML = "<p>Ingresa un número de clavo válido.</p>";
        return;
      }

      let totalInSeq = 0;
      let countUntilNow = 0;
      let connections = [];

      seq.forEach((pin, idx) => {
        if (pin === targetPin) {
          totalInSeq++;
          if (idx <= i) countUntilNow++;
          const from = idx > 0 ? seq[idx-1] : "INICIO";
          const to = idx < seq.length - 1 ? seq[idx+1] : "FIN";
          const isDone = idx < i ? "✅" : (idx === i ? "📍" : "⏳");
          
          connections.push(`<li>${isDone} Pasada ${totalInSeq}: ${from} ➔ <span class="highlight">${targetPin}</span> ➔ ${to} <br><small>Paso ${idx+1}</small></li>`);
        }
      });

      els.searchResults.innerHTML = `
        <p><b>Clavo ${targetPin}:</b> Estás en la pasada ${countUntilNow} de ${totalInSeq} totales.</p>
        <ul class="connection-list">${connections.length ? connections.join('') : 'No encontrado.'}</ul>
      `;
    }

    function setPinColor(element, value) {
      if (value === '—') {
        element.className = 'val';
        return;
      }
      element.className = `val ${Number(value) % 2 === 0 ? 'par' : 'impar'}`;
    }

    function render() {
      if (!seq.length) return;
      const cur = seq[i];
      
      // Actualizar número principal
      els.current.childNodes[0].textContent = String(cur);
      els.current.className = `big ${cur % 2 === 0 ? 'par' : 'impar'}`;
      
      // Pasadas
      const count = getPassCount(i);
      els.passCount.textContent = count > 1 ? `x${count}` : '';

      // Anterior / Siguiente con colores
      const prevVal = i > 0 ? seq[i - 1] : '—';
      const nextVal = i < seq.length - 1 ? seq[i + 1] : '—';
      
      els.prev.textContent = prevVal;
      els.next.textContent = nextVal;
      setPinColor(els.prev, prevVal);
      setPinColor(els.next, nextVal);

      els.total.textContent = seq.length;
      els.progress.textContent = `Paso ${i + 1} de ${seq.length}`;
      
      localStorage.setItem('stringart_idx_v4', i);
      
      // Auto-actualizar historial si hay un clavo buscado
      if (els.pinSearchInput.value !== "") searchPinInfo();
    }

    // --- EVENTOS ---
    const nextAction = () => { if(i < seq.length-1){ i++; render(); playSound('next'); } };
    const prevAction = () => { if(i > 0){ i--; render(); playSound('prev'); } };

    els.nextBtn.addEventListener('click', nextAction);
    els.prevBtn.addEventListener('click', prevAction);
    
    // Al tocar el número actual (soporte móvil/tab)
    els.current.addEventListener('click', nextAction);

    // Teclado
    window.addEventListener('keydown', e => {
      if (document.activeElement.tagName === 'INPUT') return; // No interferir si escribe
      if (e.code === 'Space' || e.key === 'ArrowRight') {
        e.preventDefault();
        nextAction();
      }
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevAction();
      }
    });

    // Mejoras en el buscador
    els.pinSearchInput.addEventListener('keydown', e => { if(e.key === 'Enter') searchPinInfo(); });
    els.pinSearchInput.addEventListener('input', searchPinInfo); // Flechitas y escritura tiempo real
    els.searchBtn.addEventListener('click', searchPinInfo);
    
    els.gotoBtn.addEventListener('click', () => {
      const val = parseInt(els.gotoStep.value);
      if(val >= 1 && val <= seq.length) { i = val - 1; render(); playSound('next'); }
    });

    els.file.addEventListener('change', e => { 
      if(e.target.files[0]) {
        const reader = new FileReader();
        reader.onload = async (event) => {
          const text = event.target.result;
          seq = text.replace(/\r/g, '').replace(/\n/g, ',').split(',').map(s => s.trim()).filter(Boolean).map(Number);
          i = 0;
          els.card.style.display = 'block';
          els.searchSection.style.display = 'block';
          localStorage.setItem('stringart_seq_v4', JSON.stringify(seq));
          render();
        };
        reader.readAsText(e.target.files[0]);
      }
    });

    els.reset.addEventListener('click', () => { if(confirm("¿Reiniciar al paso 1?")) { i = 0; render(); } });
    els.clear.addEventListener('click', () => { if(confirm("¿Borrar todo?")) { localStorage.clear(); location.reload(); } });

    // Desbloqueo de audio preventivo
    document.addEventListener('touchstart', initAudio, { passive: true });
    document.addEventListener('mousedown', initAudio, { passive: true });

    (function init() {
      const s = localStorage.getItem('stringart_seq_v4');
      const idx = localStorage.getItem('stringart_idx_v4');
      if (s) {
        seq = JSON.parse(s);
        i = parseInt(idx) || 0;
        els.card.style.display = 'block';
        els.searchSection.style.display = 'block';
        render();
      }
    })();
  </script>
</body>
</html>
