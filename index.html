<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>String Art – Secuencia de pines</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 24px; background: #f0f2f5; }
    .wrap { max-width: 980px; margin: 0 auto; }
    .top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    input[type="file"] { padding: 8px; border: 1px solid #ddd; border-radius: 8px; background: white; }
    input[type="number"] { padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px; width: 150px; }
    button { padding: 10px 14px; border: 1px solid #ddd; border-radius: 10px; background: #fff; cursor: pointer; font-weight: 500; }
    button:active { transform: translateY(1px); background: #eee; }
    
    .card { margin-top: 16px; padding: 18px; border: 1px solid #eee; border-radius: 14px; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .big { font-size: 84px; font-weight: 800; line-height: 1; text-align: center; margin: 18px 0 6px; user-select: none; }
    .big.par { color: blue; }
    .big.impar { color: red; }
    #pass-count { font-size: 26px; vertical-align: super; margin-left: 8px; color: #666; font-weight: 600; }
    
    .sub { text-align: center; font-size: 16px; color: #555; user-select: none; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 14px; }
    .mini { padding: 12px; border: 1px solid #eee; border-radius: 12px; background: #fafafa; }
    .mini h3 { margin: 0 0 8px; font-size: 14px; color: #666; font-weight: 650; }
    .mini .val { font-size: 26px; font-weight: 750; }
    
    .navBtns { display:flex; gap:10px; justify-content:center; margin: 20px 0; }
    .navBtns button { min-width: 140px; height: 60px; font-size: 18px; }

    /* Buscador de clavos */
    .search-box { margin-top: 30px; padding: 20px; background: #fff; border-radius: 14px; border: 1px solid #ddd; }
    .search-box h2 { margin-top: 0; font-size: 20px; }
    .search-results { margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
    .connection-list { list-style: none; padding: 0; font-family: monospace; }
    .connection-list li { padding: 5px 0; border-bottom: 1px solid #f9f9f9; }
    .highlight { font-weight: bold; color: #000; padding: 0 4px; border-radius: 4px; background: #eee; }

    .hint { margin-top: 12px; color: #666; font-size: 14px; text-align:center; }
    .ok { color: #0a7; font-weight: 650; }
    .bad { color: #c33; font-weight: 650; }

    html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>String Art – Secuencia de pines</h1>

    <div class="top">
      <input id="file" type="file" accept=".txt,text/plain" />
      <div class="group">
        <input id="gotoStep" type="number" min="1" placeholder="Ir al paso..." />
        <button id="gotoBtn" type="button">Ir</button>
      </div>
      <button id="reset" type="button">Reiniciar</button>
      <button id="clear" type="button">Borrar todo</button>
      <span id="status" class="sub"></span>
    </div>

    <div class="card" id="card" style="display:none;">
      <div class="big" id="current">—<span id="pass-count"></span></div>
      <div class="sub" id="progress">Cargá un archivo para empezar</div>

      <div class="navBtns">
        <button id="prevBtn" type="button" style="background: #fff0f0;">◀ Anterior (Grave)</button>
        <button id="nextBtn" type="button" style="background: #f0f9ff;">Siguiente ▶ (Agudo)</button>
      </div>

      <div class="row">
        <div class="mini"><h3>Anterior</h3><div class="val" id="prev">—</div></div>
        <div class="mini"><h3>Siguiente</h3><div class="val" id="next">—</div></div>
        <div class="mini"><h3>Total Pasos</h3><div class="val" id="total">—</div></div>
      </div>
    </div>

    <div class="search-box" id="searchSection" style="display:none;">
      <h2>🔍 Buscador de Clavo</h2>
      <div class="group">
        <input id="pinSearchInput" type="number" placeholder="Ej: 80" />
        <button id="searchBtn" type="button">Consultar Clavo</button>
      </div>
      <div id="searchResults" class="search-results">
        <p>Ingresa un número de clavo para ver su historial.</p>
      </div>
    </div>

    <div class="hint">
      Taps laterales en móvil también funcionan.<br>
      <b>Siguiente:</b> Clic agudo | <b>Anterior:</b> Tono grave
    </div>
  </div>

  <script>
    let seq = [];
    let i = 0;
    let audioCtx = null;

    const els = {
      file: document.getElementById('file'),
      gotoStep: document.getElementById('gotoStep'),
      gotoBtn: document.getElementById('gotoBtn'),
      reset: document.getElementById('reset'),
      clear: document.getElementById('clear'),
      status: document.getElementById('status'),
      card: document.getElementById('card'),
      current: document.getElementById('current'),
      passCount: document.getElementById('pass-count'),
      progress: document.getElementById('progress'),
      prev: document.getElementById('prev'),
      next: document.getElementById('next'),
      total: document.getElementById('total'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      pinSearchInput: document.getElementById('pinSearchInput'),
      searchBtn: document.getElementById('searchBtn'),
      searchResults: document.getElementById('searchResults'),
      searchSection: document.getElementById('searchSection')
    };

    const STORAGE_KEY_SEQ = 'stringart_seq_v4';
    const STORAGE_KEY_IDX = 'stringart_idx_v4';

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      if (type === 'next') {
        osc.frequency.setValueAtTime(850, audioCtx.currentTime); // Agudo
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.stop(audioCtx.currentTime + 0.1);
      } else {
        osc.frequency.setValueAtTime(250, audioCtx.currentTime); // Grave
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.stop(audioCtx.currentTime + 0.3);
      }

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
    }

    function getPassCount(targetIdx) {
      const pin = seq[targetIdx];
      let count = 0;
      for (let n = 0; n <= targetIdx; n++) {
        if (seq[n] === pin) count++;
      }
      return count;
    }

    function searchPinInfo() {
      const targetPin = Number(els.pinSearchInput.value);
      if (isNaN(targetPin) || !seq.length) return;

      let historyHtml = `<h3>Clavo ${targetPin}</h3>`;
      let totalInSeq = 0;
      let countUntilNow = 0;
      let connections = [];

      seq.forEach((pin, idx) => {
        if (pin === targetPin) {
          totalInSeq++;
          if (idx <= i) countUntilNow++;
          
          const from = idx > 0 ? seq[idx-1] : "Inicio";
          const to = idx < seq.length - 1 ? seq[idx+1] : "Fin";
          const isPassed = idx <= i ? "✅" : "⏳";
          
          connections.push(`<li>${isPassed} Pasada ${totalInSeq}: ${from} ➔ <span class="highlight">${targetPin}</span> ➔ ${to} <small>(Paso ${idx+1})</small></li>`);
        }
      });

      historyHtml += `<p><b>Estado actual:</b> Has realizado ${countUntilNow} de ${totalInSeq} pasadas totales.</p>`;
      historyHtml += `<ul class="connection-list">${connections.join('')}</ul>`;
      
      els.searchResults.innerHTML = historyHtml;
    }

    function render() {
      if (!seq.length) return;
      const cur = seq[i];
      els.current.childNodes[0].textContent = String(cur);
      
      const count = getPassCount(i);
      els.passCount.textContent = count > 1 ? `x${count}` : '';

      els.current.className = `big ${cur % 2 === 0 ? 'par' : 'impar'}`;
      els.prev.textContent = i > 0 ? seq[i - 1] : '—';
      els.next.textContent = i < seq.length - 1 ? seq[i + 1] : '—';
      els.total.textContent = seq.length;
      els.progress.textContent = `Paso ${i + 1} de ${seq.length}`;
      
      localStorage.setItem(STORAGE_KEY_IDX, i);
    }

    async function handleFile(file) {
      const text = await file.text();
      seq = text.replace(/\r/g, '').replace(/\n/g, ',').split(',').map(s => s.trim()).filter(Boolean).map(Number);
      i = 0;
      els.card.style.display = 'block';
      els.searchSection.style.display = 'block';
      localStorage.setItem(STORAGE_KEY_SEQ, JSON.stringify(seq));
      render();
    }

    // Eventos
    els.nextBtn.addEventListener('click', () => { if(i < seq.length-1){ i++; render(); playSound('next'); } });
    els.prevBtn.addEventListener('click', () => { if(i > 0){ i--; render(); playSound('prev'); } });
    els.searchBtn.addEventListener('click', searchPinInfo);
    els.gotoBtn.addEventListener('click', () => {
      const val = parseInt(els.gotoStep.value);
      if(val >= 1 && val <= seq.length) { i = val - 1; render(); initAudio(); }
    });

    els.file.addEventListener('change', e => { if(e.target.files[0]) handleFile(e.target.files[0]); });
    els.reset.addEventListener('click', () => { i = 0; render(); });
    els.clear.addEventListener('click', () => { localStorage.clear(); location.reload(); });

    // Carga inicial
    (function init() {
      const s = localStorage.getItem(STORAGE_KEY_SEQ);
      const idx = localStorage.getItem(STORAGE_KEY_IDX);
      if (s) {
        seq = JSON.parse(s);
        i = parseInt(idx) || 0;
        els.card.style.display = 'block';
        els.searchSection.style.display = 'block';
        render();
      }
    })();
  </script>
</body>
</html>
